<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>繪圖靈感課程庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sketchbook syllabus. Blue-pencil construction lines on cool paper; one column on phones, list + wider sheet on desktop. */
:root{
  --paper:#f3f5f8;
  --sheet:#ffffff;
  --ink:#1d2430;
  --graphite:#5b6577;
  --rule:#d9dee7;
  --blue:#2f5fd0;
  --blue-soft:#e3eafb;
  --todo:#8a93a3;
  --doing:#c27a12;
  --doing-soft:#fbefd9;
  --done:#1f8a5b;
  --done-soft:#dcf2e7;
  --font-display:"LXGW WenKai TC","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181f;--sheet:#1c212b;--ink:#e6eaf1;--graphite:#a2abbb;--rule:#2d3441;
    --blue:#7fa2ff;--blue-soft:#22304f;--todo:#8790a0;--doing:#f0aa45;--doing-soft:#3a2d17;--done:#4cc890;--done-soft:#163628;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14181f;--sheet:#1c212b;--ink:#e6eaf1;--graphite:#a2abbb;--rule:#2d3441;
  --blue:#7fa2ff;--blue-soft:#22304f;--todo:#8790a0;--doing:#f0aa45;--doing-soft:#3a2d17;--done:#4cc890;--done-soft:#163628;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{padding:28px 0 12px;display:grid;gap:10px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.15;margin:0;text-wrap:balance}
h1 .pencil{color:var(--blue)}
.lede{margin:0;color:var(--graphite);max-width:60ch}
.progress{display:grid;gap:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.progress .nums{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--graphite);font-variant-numeric:tabular-nums}
.progress .nums b{color:var(--ink);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--done)}
.bar .b-doing{background:var(--doing)}

.tools{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 8px;display:grid;gap:8px;border-bottom:1px solid var(--rule)}
.search{display:flex;align-items:center;gap:8px;background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--blue)}
.search input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;min-width:0}
.search button{border:0;background:none;color:var(--graphite);cursor:pointer;padding:6px;font-size:14px}
.qs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.qs::-webkit-scrollbar,.mods::-webkit-scrollbar{display:none}
.qs button{flex:none;border:1px dashed var(--blue);background:transparent;color:var(--blue);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--graphite)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.count{font-size:13px;color:var(--graphite);margin-left:auto;font-variant-numeric:tabular-nums}
.mods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mods button{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.mods button small{color:var(--graphite);font-variant-numeric:tabular-nums}
.mods button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.mods button[aria-pressed="true"] small{color:var(--blue)}

.unit{margin-top:22px}
.unit-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 2px 6px;border-bottom:2px solid var(--ink)}
.unit-head .no{font-family:var(--font-display);color:var(--blue);font-size:15px}
.unit-head h2{font-family:var(--font-display);font-size:22px;margin:0;text-wrap:balance}
.unit-head .meta{margin-left:auto;font-size:13px;color:var(--graphite);font-variant-numeric:tabular-nums}
.unit-desc{margin:8px 2px 4px;color:var(--graphite);font-size:14px;max-width:65ch}
ol.lessons{list-style:none;margin:0;padding:0}
ol.lessons li{border-bottom:1px solid var(--rule)}
.lesson{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:transparent;border:0;padding:11px 2px;cursor:pointer}
.lesson:hover{background:var(--sheet)}
.lesson .n{font-family:var(--font-display);color:var(--graphite);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.lesson .t{min-width:0}
.lesson .t b{display:block;font-weight:500;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lesson .t b.unknown{color:var(--graphite);font-style:italic;font-weight:400}
.lesson .t span{font-size:12px;color:var(--graphite)}
.pill{font-size:12px;border-radius:99px;padding:2px 9px;white-space:nowrap;border:1px solid var(--rule);color:var(--todo)}
.pill.doing{background:var(--doing-soft);color:var(--doing);border-color:transparent}
.pill.done{background:var(--done-soft);color:var(--done);border-color:transparent}
.empty{padding:40px 8px;text-align:center;color:var(--graphite)}
.empty button{margin-top:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:15px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}

footer.records{margin-top:40px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:grid;gap:10px}
footer.records h2{font-family:var(--font-display);font-size:20px;margin:0}
footer.records p{margin:0;color:var(--graphite);font-size:14px;max-width:65ch}
footer.records .acts{display:flex;gap:8px;flex-wrap:wrap}
footer.records textarea{width:100%;min-height:90px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:8px;font-size:13px}
.msg{font-size:14px;min-height:1.4em}
.msg.err{color:#c43b3b}
.msg.ok{color:var(--done)}

/* Lesson sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92%;background:var(--sheet);border-radius:16px 16px 0 0;display:none;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.open{display:flex}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 32px));max-height:88%;border-radius:16px}
}
.sheet-head{display:flex;gap:10px;align-items:flex-start;padding:16px 16px 10px;border-bottom:1px solid var(--rule)}
.sheet-head .crumb{font-size:13px;color:var(--blue);font-family:var(--font-display)}
.sheet-head h3{margin:2px 0 0;font-size:19px;line-height:1.35;overflow-wrap:anywhere;text-wrap:balance}
.sheet-head .x{margin-left:auto;flex:none;border:0;background:var(--paper);border-radius:99px;width:36px;height:36px;cursor:pointer;font-size:18px}
.sheet-body{overflow-y:auto;padding:14px 16px 18px;display:grid;gap:16px;grid-auto-rows:max-content;align-content:start}
.player{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden;display:grid}
.player:empty{display:none}
.player iframe{width:100%;border:0;display:block;background:#fff}
.player .tweet{min-height:120px;padding:0 8px}
.fbbox{display:flex;justify-content:center;background:#000}
.igbox{padding:0;display:flex;justify-content:center}
.igbox .instagram-media{margin:0 auto!important;width:100%!important;max-width:540px!important;min-width:0!important;border:0!important;box-shadow:none!important}
.igbox iframe{max-width:100%}
.quiet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.quiet .btn{font-size:14px;padding:7px 12px}
#quietBtn[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.quiet small{color:var(--graphite);font-size:12.5px;flex:1 1 200px}
.quietbox{padding:20px 16px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--graphite);font-size:14px}
[hidden]{display:none!important}
.pctl{display:grid;gap:6px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtns .btn{flex:1 1 140px;font-size:14px;padding:8px 10px}
#sMute[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.pctl small{color:var(--graphite);font-size:12.5px;line-height:1.5}
.player .gone{padding:24px 16px;text-align:center;color:var(--graphite);font-size:14px}
.watch{display:grid;gap:6px}
.watch .btn.primary{width:100%;padding:11px 14px;font-size:15px;background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.watch small{color:var(--graphite);font-size:13px}
.blk h4{margin:0 0 6px;font-size:13px;letter-spacing:.04em;color:var(--graphite);font-weight:700}
.blk .src{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;background:var(--paper);border-left:3px solid var(--rule);padding:8px 10px;border-radius:0 8px 8px 0;margin:0}
.evidence{font-size:13px;color:var(--graphite)}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tagline span{font-size:12px;border:1px solid var(--rule);border-radius:6px;padding:1px 7px;color:var(--graphite)}
.practice{border:1.5px dashed var(--blue);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.practice h4{color:var(--blue)}
.practice p{margin:0;font-size:15px}
.practice .crit{font-size:14px;color:var(--graphite)}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.status button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:10px;padding:9px 4px;cursor:pointer;font-size:14px}
.status button[aria-pressed="true"][data-s="todo"]{border-color:var(--todo);background:var(--paper)}
.status button[aria-pressed="true"][data-s="doing"]{border-color:var(--doing);background:var(--doing-soft);color:var(--doing);font-weight:700}
.status button[aria-pressed="true"][data-s="done"]{border-color:var(--done);background:var(--done-soft);color:var(--done);font-weight:700}
#note{width:100%;min-height:96px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:10px;resize:vertical}
.nav{display:flex;gap:8px;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
.nav .btn{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.lesson,.btn,.mods button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>繪圖靈感<span class="pencil">課程庫</span></h1>
    <p class="lede">整理自留己看「繪圖靈感」資料夾的 266 則收藏，依原本的 13 個分類編成單元。點一堂課就能在頁面裡看原始影片或貼文，跟著練習並記錄進度。影片從 Instagram、Threads、Facebook、X 即時載入，需要網路。</p>
    <div class="progress" aria-live="polite">
      <div class="nums" id="nums"></div>
      <div class="bar" aria-hidden="true"><i class="b-done" id="barDone"></i><i class="b-doing" id="barDoing"></i></div>
    </div>
    <div class="quiet">
      <button class="btn" type="button" id="quietBtn" role="switch" aria-checked="false"></button>
      <small id="quietNote"></small>
    </div>
  </header>

  <div class="tools">
    <label class="search" for="q">
      <span aria-hidden="true">⌕</span>
      <span class="sr">搜尋課程</span>
      <input id="q" type="search" placeholder="輸入問題，例如：線稿很糊、手怎麼畫" autocomplete="off">
      <button type="button" id="clearQ" hidden>清除</button>
    </label>
    <div class="qs" id="qs" aria-label="常見問題"></div>
    <div class="row2">
      <div class="seg" role="group" aria-label="學習狀態" id="seg"></div>
      <span class="count" id="count"></span>
    </div>
    <div class="mods" id="mods" role="group" aria-label="單元"></div>
  </div>

  <main id="list"></main>

  <footer class="records">
    <h2>學習紀錄</h2>
    <p>進度和筆記只存在你現在使用的這個瀏覽器裡，手機和電腦不會自動同步。要搬到別的裝置，先按「複製紀錄」，到另一台裝置打開這個頁面後，貼到下方再按「匯入」。</p>
    <div class="acts">
      <button class="btn" type="button" id="exportBtn">複製紀錄</button>
      <button class="btn" type="button" id="importBtn">匯入</button>
    </div>
    <label for="io" class="sr">紀錄內容</label>
    <textarea id="io" placeholder="貼上複製的紀錄後按「匯入」"></textarea>
    <div class="msg" id="msg" role="status"></div>
    <p>單元順序是建議的學習順序，由這個頁面安排，不是原作者的課綱。每堂課的「練習」也是另外設計的，不是影片或貼文的內容。</p>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sheet-head">
    <div>
      <div class="crumb" id="sCrumb"></div>
      <h3 id="sTitle"></h3>
    </div>
    <button class="x" type="button" id="sClose" aria-label="關閉課程">✕</button>
  </div>
  <div class="sheet-body">
    <div class="player" id="sPlayer"></div>
    <div class="pctl" id="sCtl" hidden>
      <div class="pbtns">
        <button class="btn" type="button" id="sStop">■ 停止播放</button>
        <button class="btn" type="button" id="sMute" aria-pressed="false" hidden>🔇 Facebook 靜音：關</button>
      </div>
      <small id="sCtlNote"></small>
    </div>
    <div class="watch">
      <a class="btn primary" id="sOpen" href="#" target="_blank" rel="noopener noreferrer"></a>
      <small id="sOpenNote"></small>
    </div>
    <div class="blk">
      <h4>學習狀態</h4>
      <div class="status" role="group" aria-label="學習狀態" id="sStatus">
        <button type="button" data-s="todo">待學習</button>
        <button type="button" data-s="doing">練習中</button>
        <button type="button" data-s="done">已完成</button>
      </div>
    </div>
    <div class="practice">
      <h4>練習（另外設計）</h4>
      <p id="sEx"></p>
      <p class="crit" id="sCrit"></p>
    </div>
    <div class="blk">
      <h4>收藏原文</h4>
      <p class="src" id="sSrc"></p>
      <p class="evidence" id="sEvidence"></p>
    </div>
    <div class="blk">
      <h4>搜尋標籤</h4>
      <div class="tagline" id="sTags"></div>
    </div>
    <div class="blk">
      <label for="note"><h4>我的筆記</h4></label>
      <textarea id="note" placeholder="看完寫下重點、卡住的地方或下次要試的事"></textarea>
      <div class="msg" id="noteMsg" role="status"></div>
    </div>
  </div>
  <div class="nav">
    <button class="btn" type="button" id="sPrev">← 上一堂</button>
    <button class="btn" type="button" id="sNext">下一堂 →</button>
  </div>
</section>

function platformOf(u){

  if(/threads\.(com|net)/.test(u)) return "Threads";
  if(/facebook\.com/.test(u)) return "Facebook";
  if(/x\.com|twitter\.com/.test(u)) return "X";
  return "原網站";
}
function kindOf(u){
  if(/instagram\.com\/reel\//.test(u)) return "影片";
  if(/instagram\.com\/p\//.test(u)) return "圖文貼文";
  if(/facebook\.com\/(reel\/|[^/]+\/videos\/)/.test(u)) return "影片";
  return "貼文";
}

function titleOf(t){
  let s=(t||"").trim();
  if(!s||s==="(無內文)"||/^\d+$/.test(s)||s==="facebook.com") return null;
  s=s.replace(/^a_designer_my 於 [^:]+:\s*"?/,"");
  s=s.replace(/^[【「]/,"").replace(/[】」]\s*/," ").trim();
  const cut=s.search(/[。！？!?\n]|\s{2}| 📌| ❇️| ⬇️/);
  if(cut>6) s=s.slice(0,cut+ (/[！？!?]/.test(s[cut])?1:0));
  if(s.length>42) s=s.slice(0,40)+"…";
  return s.replace(/\|\|$/,"").trim();
}

LESSONS.forEach((l,i)=>{l.no=LESSONS.filter((x,j)=>j<=i&&x.cat===l.cat).length;});

/* ---------- storage ---------- */
const KEY="drawcourse.v1";
let store={version:1,progress:{}};
let storageOK=true;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.version===1&&s.progress&&typeof s.progress==="object")store=s;}catch(e){storageOK=false;}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(store));return true;}
  catch(e){storageOK=false;showMsg("無法存到這個瀏覽器（可能是無痕模式或儲存空間被封鎖）。請用「複製紀錄」先把進度保存起來。",true);return false;}
}
const st=id=>(store.progress[id]&&store.progress[id].s)||"todo";
const note=id=>(store.progress[id]&&store.progress[id].n)||"";
function setP(id,patch){
  const cur=store.progress[id]||{s:"todo",n:""};
  const next={...cur,...patch,t:Date.now()};
  if(next.s==="todo"&&!next.n) delete store.progress[id]; else store.progress[id]=next;
  return save();
}

/* ---------- state ---------- */
const STATUS=[["all","全部"],["todo","待學習"],["doing","練習中"],["done","已完成"]];
const SL={todo:"待學習",doing:"練習中",done:"已完成"};
let fStatus="all",fUnit="all",query="";
try{const v=JSON.parse(sessionStorage.getItem("drawcourse.view")||"null");if(v){fStatus=v.s||"all";fUnit=v.u??"all";}}catch(e){}

const $=s=>document.querySelector(s);
const el=(tag,props={},kids=[])=>{const e=document.createElement(tag);for(const k in props){if(k==="text")e.textContent=props[k];else if(k==="class")e.className=props[k];else e.setAttribute(k,props[k]);}kids.forEach(c=>c&&e.appendChild(c));return e;};

function terms(q){
  const words=q.toLowerCase().split(/[\s,，、]+/).filter(Boolean);
  return words.map(w=>{
    const extra=[];
    for(const k in SYNONYMS) if(w.includes(k)) extra.push(...SYNONYMS[k]);
    TAG_RULES.forEach(([re,tag])=>{if(re.test(w)||w.includes(tag.toLowerCase()))extra.push(tag);});
    const core=w.replace(/怎麼畫|怎麼辦|怎麼|如何|很|的|畫法|畫/g,"")||w;
    return {w,core,extra:[...new Set(extra)]};
  });
}
/* Score: tag or unit match 4, title 3, own note 2, collected text 1. Every term must score. */
function score(l,ts){
  if(!ts.length) return 1;
  const title=l.title.toLowerCase(),txt=l.txt.toLowerCase(),nt=note(l.id).toLowerCase(),unit=(l.cat+" "+l.unit.name).toLowerCase();
  let total=0;
  for(const t of ts){
    let s=0;
    if(t.extra.some(x=>l.tags.includes(x)||l.cat===x)||unit.includes(t.core)) s+=4;
    if(title.includes(t.w)||title.includes(t.core)) s+=3;
    if(nt&&(nt.includes(t.w)||nt.includes(t.core))) s+=2;
    if(txt.includes(t.w)||(t.core.length>1&&txt.includes(t.core))) s+=1;
    if(!s) return 0;
    total+=s;
  }
  return total;
}
function visible(){
  const ts=terms(query);
  const out=[];
  LESSONS.forEach((l,i)=>{
    if(fUnit!=="all"&&l.cat!==fUnit) return;
    if(fStatus!=="all"&&st(l.id)!==fStatus) return;
    const s=score(l,ts);if(s) out.push({l,s,i});
  });
  if(ts.length) out.sort((a,b)=>b.s-a.s||a.i-b.i);
  return out.map(x=>x.l);
}

/* ---------- render ---------- */
function renderProgress(){
  const n=LESSONS.length;let d=0,g=0;
  LESSONS.forEach(l=>{const s=st(l.id);if(s==="done")d++;else if(s==="doing")g++;});
  const nums=$("#nums");nums.textContent="";
  [["共",n,"堂"],["已完成",d,"堂"],["練習中",g,"堂"],["待學習",n-d-g,"堂"]].forEach(([a,b,c])=>{nums.appendChild(el("span",{},[document.createTextNode(a+" "),el("b",{text:String(b)}),document.createTextNode(" "+c)]));});
  $("#barDone").style.width=(d/n*100)+"%";$("#barDoing").style.width=(g/n*100)+"%";
}
function renderControls(){
  const seg=$("#seg");seg.textContent="";
  STATUS.forEach(([k,lab])=>{const b=el("button",{type:"button","aria-pressed":String(fStatus===k),text:lab});b.onclick=()=>{fStatus=k;persistView();render();};seg.appendChild(b);});
  const mods=$("#mods");mods.textContent="";
  const allB=el("button",{type:"button","aria-pressed":String(fUnit==="all")},[document.createTextNode("全部單元 "),el("small",{text:String(LESSONS.length)})]);
  allB.onclick=()=>{fUnit="all";persistView();render();};mods.appendChild(allB);
  UNITS.forEach((u,i)=>{const c=LESSONS.filter(l=>l.cat===u.cat).length;const b=el("button",{type:"button","aria-pressed":String(fUnit===u.cat)},[document.createTextNode(u.name+" "),el("small",{text:String(c)})]);b.onclick=()=>{fUnit=u.cat;persistView();render();};mods.appendChild(b);});
}
function persistView(){try{sessionStorage.setItem("drawcourse.view",JSON.stringify({s:fStatus,u:fUnit}));}catch(e){}}
let current=[];
function render(){
  renderControls();renderProgress();
  current=visible();
  $("#count").textContent=`顯示 ${current.length} / ${LESSONS.length} 堂`;
  $("#clearQ").hidden=!query;
  const list=$("#list");list.textContent="";
  if(!current.length){
    const box=el("div",{class:"empty"},[el("p",{text:query?`找不到和「${query}」有關的課。試試更短的詞，例如「手」「線稿」「光」，或清除篩選。`:"這個篩選目前沒有課程。"})]);
    const b=el("button",{class:"btn",type:"button",text:"清除搜尋與篩選"});b.onclick=()=>{query="";$("#q").value="";fStatus="all";fUnit="all";persistView();render();};
    box.appendChild(b);list.appendChild(box);return;
  }
  if(query){
    const sec=el("section",{class:"unit","aria-labelledby":"uq"});
    sec.appendChild(el("div",{class:"unit-head"},[el("span",{class:"no",text:"搜尋"}),el("h2",{id:"uq",text:`「${query}」的相關課程`}),el("span",{class:"meta",text:"最相關的在前"})]));
    const ol=el("ol",{class:"lessons"});
    current.forEach(l=>ol.appendChild(el("li",{},[lessonRow(l,true)])));
    sec.appendChild(ol);list.appendChild(sec);return;
  }
  UNITS.forEach((u,ui)=>{
    const ls=current.filter(l=>l.cat===u.cat);if(!ls.length)return;
    const all=LESSONS.filter(l=>l.cat===u.cat);const dn=all.filter(l=>st(l.id)==="done").length;
    const sec=el("section",{class:"unit","aria-labelledby":"u"+ui});
    sec.appendChild(el("div",{class:"unit-head"},[el("span",{class:"no",text:"單元 "+String(ui+1).padStart(2,"0")}),el("h2",{id:"u"+ui,text:u.name}),el("span",{class:"meta",text:`${dn}/${all.length} 完成`})]));
    sec.appendChild(el("p",{class:"unit-desc",text:u.desc}));
    const ol=el("ol",{class:"lessons"});
    ls.forEach(l=>ol.appendChild(el("li",{},[lessonRow(l,false)])));
    sec.appendChild(ol);list.appendChild(sec);
  });
}
function lessonRow(l,showUnit){
  const s=st(l.id);
  const meta=(showUnit?l.unit.name+"・":"")+`${l.platform}・${l.kind}`+(note(l.id)?"・有筆記":"");
  const b=el("button",{class:"lesson",type:"button"},[
    el("span",{class:"n",text:String(l.no)}),
    el("span",{class:"t"},[el("b",{class:l.known?"":"unknown",text:l.title}),el("span",{text:meta})]),
    el("span",{class:"pill "+s,text:SL[s]})
  ]);
  b.onclick=()=>openLesson(l.id,b);
  return b;
}

/* ---------- lesson sheet ---------- */
let openId=null,returnFocus=null,noteTimer=null;
let twPromise=null;
function loadTwitter(){
  if(!twPromise)twPromise=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://platform.twitter.com/widgets.js";s.async=true;s.charset="utf-8";
    s.onload=()=>{let n=0;const t=setInterval(()=>{if(window.twttr&&twttr.widgets&&twttr.widgets.createTweet){clearInterval(t);res(twttr);}else if(++n>100){clearInterval(t);twPromise=null;rej();}},100);};
    s.onerror=()=>{twPromise=null;s.remove();rej();};document.head.appendChild(s);});
  return twPromise;
}
const MKEY="drawcourse.mute";
let fbMute=false;try{fbMute=localStorage.getItem(MKEY)==="1";}catch(e){}
let fbPlayer=null,fbTarget=null,fbSdk=null,stopped=false,forceLoad=false;
const QKEY="drawcourse.quiet";let quiet=false;try{quiet=localStorage.getItem(QKEY)==="1";}catch(e){}
function syncQuiet(){const b=$("#quietBtn");b.setAttribute("aria-checked",String(quiet));b.textContent=quiet?"🔕 安靜模式：開":"🔔 安靜模式：關";
  $("#quietNote").textContent=quiet?"課程不會載入影片播放器，只顯示文字和「打開原文」；需要時可在課程裡單獨播放。":"開啟後，課程不載入播放器，完全不會有聲音。";}
function isFbVideo(l){return !!(l.embed&&!l.embed.tweet&&/facebook\.com\/(reel\/|[^/]+\/videos\/)/.test(l.src));}
function iframeFor(l){return el("iframe",{src:l.embed.src,title:l.title+"（"+l.platform+"）",style:"height:"+l.embed.h+"px",allow:"autoplay; encrypted-media; picture-in-picture; fullscreen",allowfullscreen:"",loading:"lazy",referrerpolicy:"strict-origin-when-cross-origin"});}
let igPromise=null;
function loadIg(){
  if(window.instgrm&&instgrm.Embeds)return Promise.resolve(instgrm);
  if(!igPromise)igPromise=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://www.instagram.com/embed.js";sc.async=true;
    sc.onload=()=>{let n=0;const t=setInterval(()=>{if(window.instgrm&&instgrm.Embeds){clearInterval(t);res(instgrm);}else if(++n>50){clearInterval(t);rej();}},100);};
    sc.onerror=()=>{sc.remove();rej();};document.body.appendChild(sc);});
  return igPromise;
}
function loadFb(){
  if(window.FB&&FB.XFBML)return Promise.resolve(FB);
  // Instagram 的 embed.js 必須比 Facebook SDK 先載入，否則會失效
  if(!fbSdk)fbSdk=loadIg().catch(()=>{}).then(()=>new Promise((res,rej)=>{
    window.fbAsyncInit=()=>{FB.init({xfbml:false,version:"v23.0"});
      FB.Event.subscribe("xfbml.ready",m=>{if(m.type!=="video"||!fbTarget||(m.id&&m.id!==fbTarget))return;fbPlayer=m.instance;if(fbMute){try{fbPlayer.mute();}catch(e){}}});
      res(FB);};
    const sc=document.createElement("script");sc.src="https://connect.facebook.net/zh_TW/sdk.js";sc.async=true;sc.crossOrigin="anonymous";
    sc.onerror=()=>{fbSdk=null;sc.remove();rej();};document.body.appendChild(sc);setTimeout(rej,10000);}));
  return fbSdk;
}
function clearPlayer(){$("#sPlayer").textContent="";fbPlayer=null;fbTarget=null;}
function renderPlayer(l){
  const pl=$("#sPlayer");clearPlayer();const id=l.id;
  if(l.gone){pl.appendChild(el("p",{class:"gone",text:`${l.platform} 回報這則貼文已不存在或無法公開觀看（可能已被作者刪除），所以無法播放。`}));return;}
  if(!l.embed)return;
  if(quiet&&!forceLoad){pl.appendChild(el("div",{class:"quietbox"},[el("p",{text:"安靜模式開啟中，這堂課沒有載入播放器。"}),(()=>{const b=el("button",{class:"btn",type:"button",text:"▶ 只播放這一堂"});b.addEventListener("click",()=>{forceLoad=true;renderPlayer(l);updateCtl(l);});return b;})()]));return;}
  if(l.embed.tweet){const box=el("div",{class:"tweet"});pl.appendChild(box);
    loadTwitter().then(tw=>{if(openId!==id)return;return tw.widgets.createTweet(l.embed.tweet,box,{lang:"zh-tw",dnt:true,align:"center"}).then(r=>{if(!r&&openId===id)box.appendChild(el("p",{class:"gone",text:"X 沒有顯示這則貼文（可能已刪除或設為私人），請用下方按鈕到 X 打開。"}));});})
      .catch(()=>{if(openId===id)box.appendChild(el("p",{class:"gone",text:"X 播放器載入失敗，請用下方按鈕到 X 打開。"}));});}
  else if(l.embed.ig){
    const box=el("div",{class:"igbox"});const bq=el("blockquote",{class:"instagram-media","data-instgrm-permalink":l.embed.ig+"?utm_source=ig_embed","data-instgrm-version":"14"});
    box.appendChild(bq);pl.appendChild(box);
    const fallback=()=>{if(openId!==id||!box.isConnected)return;const f=box.querySelector("iframe");if(!f||f.offsetHeight<60)box.replaceWith(iframeFor(l));};
    loadIg().then(ig=>{if(openId!==id||!box.isConnected)return;ig.Embeds.process();setTimeout(fallback,8000);}).catch(fallback);
  }
  else if(isFbVideo(l)){
    const vid="fbv"+Date.now();fbTarget=vid;const box=el("div",{class:"fbbox"});pl.appendChild(box);
    loadFb().then(FB=>{if(openId!==id||fbTarget!==vid)return;
      const w=Math.round(Math.min(500,Math.max(240,pl.clientWidth-2)));
      box.appendChild(el("div",{class:"fb-video",id:vid,"data-href":l.src,"data-width":String(w),"data-show-text":"false","data-allowfullscreen":"true"}));FB.XFBML.parse(box);})
    .catch(()=>{if(openId===id&&fbTarget===vid){fbTarget=null;box.replaceWith(iframeFor(l));updateCtl(l);}});
  }
  else pl.appendChild(iframeFor(l));
}
function updateCtl(l){
  const has=!!(l&&l.embed&&!l.gone&&!(quiet&&!forceLoad));$("#sCtl").hidden=!has;if(!has)return;
  $("#sStop").textContent=stopped?"▶ 重新載入播放器":"■ 停止播放";
  const fb=isFbVideo(l),m=$("#sMute");m.hidden=!fb;
  m.setAttribute("aria-pressed",String(fbMute));m.textContent=fbMute?"🔇 Facebook 靜音：開":"🔈 Facebook 靜音：關";
  $("#sCtlNote").textContent=stopped?"播放器已移除，聲音已停止。":
    fb?(fbTarget===null&&!fbPlayer&&$("#sPlayer iframe")?"Facebook 靜音工具沒載入成功，請按播放器裡的喇叭圖示，或按「停止播放」。":(fbMute?"Facebook 影片會以靜音播放，再按一次就恢復聲音。這個設定會記住。":"按「Facebook 靜音」可讓這類影片不出聲，這個設定會記住。"))
      :`${l.platform} 不開放網站控制音量：要關聲音請按「停止播放」，或按播放器裡的喇叭圖示。`;
}
syncQuiet();
$("#quietBtn").addEventListener("click",()=>{quiet=!quiet;try{localStorage.setItem(QKEY,quiet?"1":"0");}catch(e){}syncQuiet();});
$("#sStop").addEventListener("click",()=>{const l=LESSONS.find(x=>x.id===openId);if(!l)return;
  if(stopped){stopped=false;renderPlayer(l);}else{stopped=true;clearPlayer();$("#sPlayer").appendChild(el("p",{class:"gone",text:"已停止播放。"}));}updateCtl(l);});
$("#sMute").addEventListener("click",()=>{fbMute=!fbMute;try{localStorage.setItem(MKEY,fbMute?"1":"0");}catch(e){}
  const p=fbPlayer;if(p){try{fbMute?p.mute():p.unmute();}catch(e){}}
  updateCtl(LESSONS.find(x=>x.id===openId));
  if(p&&!fbMute)setTimeout(()=>{try{if(fbPlayer===p&&!fbMute&&p.isMuted())$("#sCtlNote").textContent="Facebook 沒有讓網站恢復聲音，請按播放器裡的喇叭圖示。";}catch(e){}},600);});
function openLesson(id,from){
  const l=LESSONS.find(x=>x.id===id);if(!l)return;
  openId=id;if(from)returnFocus=from;
  $("#sCrumb").textContent=`單元 ${String(l.unit.idx+1).padStart(2,"0")}・${l.unit.name}・第 ${l.no} 堂`;
  $("#sTitle").textContent=l.title;
  stopped=false;forceLoad=false;renderPlayer(l);updateCtl(l);
  const a=$("#sOpen");a.href=l.src;a.textContent=`在 ${l.platform} 打開原文 ↗`;
  $("#sOpenNote").textContent=l.gone?"原連結保留在這裡，你可以自己確認。":`播放器空白、要求登入或顯示無法播放時，按上方按鈕到 ${l.platform} 觀看。原文若已刪除或設為私人，兩邊都看不到。`;
  $("#sSrc").textContent=l.txt&&l.txt!=="(無內文)"?l.txt:"（收藏裡沒有內文）";
  $("#sEvidence").textContent=(l.known?"課名取自收藏內文；這個頁面沒有逐一看過影片，所以不列操作步驟。":"收藏裡沒有可用的文字，看完播放器後可以在筆記裡記下它在教什麼。")+" 收藏內文最多擷取約 140 字。";
  const tg=$("#sTags");tg.textContent="";[l.unit.name,...l.tags].forEach(t=>tg.appendChild(el("span",{text:t})));
  $("#sEx").textContent=l.unit.ex;$("#sCrit").textContent="完成標準："+l.unit.crit;
  syncStatus();
  $("#note").value=note(id);$("#noteMsg").textContent="";$("#noteMsg").className="msg";
  const i=current.findIndex(x=>x.id===id);
  $("#sPrev").disabled=i<=0;$("#sNext").disabled=i<0||i>=current.length-1;
  $("#scrim").classList.add("open");$("#sheet").classList.add("open");
  document.body.style.overflow="hidden";
  $("#sheet .sheet-body").scrollTop=0;
  $("#sClose").focus();
}
function syncStatus(){
  const s=st(openId);
  document.querySelectorAll("#sStatus button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===s)));
}
function closeLesson(){
  if(!openId)return;flushNote();
  openId=null;clearPlayer();stopped=false;forceLoad=false;$("#scrim").classList.remove("open");$("#sheet").classList.remove("open");
  document.body.style.overflow="";render();
  if(returnFocus&&document.body.contains(returnFocus))returnFocus.focus();
}
function flushNote(){
  if(!openId)return;clearTimeout(noteTimer);
  const v=$("#note").value;if(v!==note(openId)){if(setP(openId,{n:v})){$("#noteMsg").textContent="已儲存在這個瀏覽器";$("#noteMsg").className="msg ok";}}
}
document.querySelectorAll("#sStatus button").forEach(b=>b.onclick=()=>{setP(openId,{s:b.dataset.s});syncStatus();renderProgress();});
$("#note").addEventListener("input",()=>{clearTimeout(noteTimer);$("#noteMsg").textContent="";noteTimer=setTimeout(flushNote,600);});
$("#sClose").onclick=closeLesson;$("#scrim").onclick=closeLesson;
function step(d){flushNote();const i=current.findIndex(x=>x.id===openId);const n=current[i+d];if(n)openLesson(n.id);}
$("#sPrev").onclick=()=>step(-1);$("#sNext").onclick=()=>step(1);
document.addEventListener("keydown",e=>{
  if(!openId)return;
  if(e.key==="Escape"){e.preventDefault();closeLesson();}
  if(e.key==="Tab"){const f=[...$("#sheet").querySelectorAll("a[href],button:not([disabled]),textarea")];const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
});

/* ---------- search ---------- */
let qt=null;
$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value.trim();render();},120);});
$("#clearQ").onclick=()=>{query="";$("#q").value="";render();$("#q").focus();};
QUICK.forEach(q=>{const b=el("button",{type:"button",text:q});b.onclick=()=>{query=q;$("#q").value=q;fUnit="all";persistView();render();};$("#qs").appendChild(b);});

/* ---------- export / import ---------- */
function showMsg(t,err){const m=$("#msg");m.textContent=t;m.className="msg "+(err?"err":"ok");}
$("#exportBtn").onclick=async()=>{
  const data=JSON.stringify({app:"drawcourse",version:1,exported:new Date().toISOString(),progress:store.progress});
  $("#io").value=data;
  try{await navigator.clipboard.writeText(data);showMsg(`已複製 ${Object.keys(store.progress).length} 堂課的紀錄。貼到記事本或傳給自己保存。`);}
  catch(e){$("#io").select();showMsg("瀏覽器不允許自動複製。紀錄已放在下方框內，請長按或按 Ctrl+C 自行複製。");}
};
$("#importBtn").onclick=()=>{
  let obj;try{obj=JSON.parse($("#io").value);}catch(e){showMsg("內容不是有效的紀錄。請貼上完整的「複製紀錄」內容。",true);return;}
  if(!obj||obj.version!==1||typeof obj.progress!=="object"||Array.isArray(obj.progress)){showMsg("紀錄版本不符，無法匯入。",true);return;}
  const ids=new Set(LESSONS.map(l=>l.id));let ok=0,skip=0;const next={};
  for(const [id,v] of Object.entries(obj.progress)){
    if(!ids.has(id)||!v||!["todo","doing","done"].includes(v.s)||(v.n!==undefined&&typeof v.n!=="string")){skip++;continue;}
    next[id]={s:v.s,n:(v.n||"").slice(0,20000),t:typeof v.t==="number"?v.t:Date.now()};ok++;
  }
  store.progress={...store.progress,...next};
  if(save()){showMsg(`已匯入 ${ok} 堂課的紀錄`+(skip?`，略過 ${skip} 筆無法辨識的資料。`:"。"));}
  render();
};

render();
if(!storageOK) showMsg("這個瀏覽器目前無法儲存進度。可以照常看課，但記得用「複製紀錄」保存。",true);
</script>
